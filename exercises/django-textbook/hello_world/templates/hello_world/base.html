<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Django Site{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 2rem;
        }
        header h1 { margin: 0; font-size: 1.4rem; }
        nav a {
            color: #a9d0f5;
            text-decoration: none;
            margin-right: 1.5rem;
            font-weight: bold;
        }
        nav a:hover { color: white; }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }
        h1.page-title { color: #2c3e50; }
        .highlight { color: #3498db; }
        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.85rem;
            color: #7f8c8d;
            background-color: #eaf1f8;
        }
        ul.skills-list { text-align: left; display: inline-block; }
        table.numbers-table { border-collapse: collapse; margin: 0 auto; }
        table.numbers-table th, table.numbers-table td {
            border: 1px solid #ccc;
            padding: 0.4rem 1rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Django Site</h1>
        <nav>
            <a href="{% url 'hello_world:hello_world' %}">Home</a>
            <a href="{% url 'hello_world:about' %}">About</a>
            <a href="{% url 'hello_world:numbers' %}">Numbers</a>
        </nav>
    </header>
    <main>
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>
    <footer>
        &copy; {{ year|default:"2026" }} - Built with Django
    </footer>
</body>
</html>
